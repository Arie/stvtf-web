<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stvmap</title>
<link rel="stylesheet" href="/killicons.css">
<style>
  :root {
    --bg: #15171a; --panel: #1e2125; --line: #2c3036; --text: #d8dadd; --dim: #8a9099;
    --red: #d0453f; --blue: #4f8fc0; --red-soft: #d0453f33; --blue-soft: #4f8fc033;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* Laid out for 1080p streams; --s scales the HUD, panel and markers with the window height. */
  :root { --s: 1; }
  body { display: grid; grid-template-rows: 1fr; }
  #title { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #title b { font-size: 15px; }
  .hud, #scoreboard, #follow, #bgtoggle, #autozoom, #sidetoggle, aside { zoom: var(--s); }
  #status.ok { color: #7cc47f; } #status.bad { color: #e0a040; }
  #age { color: var(--dim); margin-left: auto; }
  main { display: grid; grid-template-columns: 1fr auto; min-height: 0; }
  #stage { position: relative; min-height: 0; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #banner { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    padding: 6px 16px; border-radius: 4px; background: #000a; font-weight: 600; font-size: 15px;
    opacity: 0; transition: opacity .4s; pointer-events: none; }
  aside { width: 380px; border-left: 1px solid var(--line); background: var(--panel); display: flex;
    flex-direction: column; min-height: 0; }
  aside section { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  aside h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  /* Spectator HUD over the map: BLU down the left edge, RED down the right, like TF2. */
  .hud { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column;
    gap: 3px; width: 250px; pointer-events: none; z-index: 2;
    font-family: "TF2 Build", "Oswald", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; }
  #hud-blue { left: 10px; } #hud-red { right: 10px; }
  .card { --team: var(--blue); position: relative; height: 40px; display: grid; align-items: center;
    grid-template-columns: 40px 1fr auto; background: #0b0c0ecc; overflow: hidden; }
  #hud-red .card, #hud-red .charge { --team: var(--red); }
  /* Fills stay full width and are revealed with clip-path, so the über stripes (a fixed
     24px tile) never stretch when health or charge changes. */
  .card .fill { position: absolute; inset: 0; clip-path: inset(0 100% 0 0); transition: clip-path .25s linear;
    background: linear-gradient(90deg, color-mix(in srgb, var(--team) 70%, #000), color-mix(in srgb, var(--team) 45%, #000)); }
  .card > :not(.fill) { position: relative; }
  .card .ci { width: 40px; height: 40px; padding: 6px; background: var(--team); display: grid; place-items: center; font-weight: 800; }
  .card .ci img { width: 28px; height: 28px; }
  .card .nm { padding: 0 6px; min-width: 0; line-height: 1.05; }
  .card .nm b { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; text-shadow: 0 1px 2px #000; }
  .card .nm small { font-size: 11px; color: #ffffffa0; letter-spacing: .02em; }
  .card .hp { padding: 0 9px; font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 #000a; font-variant-numeric: tabular-nums; }
  .card.over .hp { color: #9ff0ff; }
  .card.low .hp { color: #ff6b5a; animation: pulse .7s infinite alternate; }
  .card.dead { filter: grayscale(1) brightness(.55); }
  .card.dead .hp { font-size: 12px; font-weight: 600; letter-spacing: .08em; }
  .card .tag { margin-right: 5px; padding: 0 4px; font-size: 9px; font-weight: 800;
    letter-spacing: .08em; color: #000; background: #fff; border-radius: 2px; }
  .card.ub { box-shadow: inset 0 0 0 2px #fff8, 0 0 12px var(--team); }
  .card.ub .fill { --stripe: color-mix(in srgb, var(--team) 80%, #fff);
    background: linear-gradient(135deg, var(--stripe) 25%, var(--team) 25% 50%, var(--stripe) 50% 75%, var(--team) 75%) 0 0 / 24px 24px;
    animation: stripes 1s linear infinite; }
  .charge { --team: var(--blue); position: relative; height: 30px; margin-top: 4px; background: #0b0c0ecc;
    display: flex; align-items: center; gap: 6px; padding: 0 8px; overflow: hidden; }
  .charge .bar { position: absolute; inset: 0; clip-path: inset(0 100% 0 0); transition: clip-path .3s linear;
    background: color-mix(in srgb, var(--team) 55%, #000); }
  .charge .segs { position: absolute; inset: 0; }
  .charge .seg { position: absolute; top: 0; bottom: 0; width: 2px; background: #0b0c0e; }
  .charge > span { position: relative; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #fff; text-transform: uppercase;
    text-shadow: 0 0 3px #000, 0 1px 2px #000; }
  .charge.releasing > span { background: #000b; padding: 1px 5px; border-radius: 2px; }
  .charge .pct { margin-left: auto; font-size: 17px; font-variant-numeric: tabular-nums; }
  .charge.ready .bar { background: linear-gradient(90deg, var(--team), color-mix(in srgb, var(--team) 60%, #fff)); animation: pulse 1s infinite alternate; }
  .charge.releasing { box-shadow: 0 0 14px var(--team); }
  .charge.releasing .bar { background: linear-gradient(135deg, #fff 25%, var(--team) 25% 50%, #fff 50% 75%, var(--team) 75%) 0 0 / 24px 24px;
    animation: stripes .6s linear infinite; }
  .charge.dead { filter: grayscale(1) brightness(.55); }
  .card { cursor: pointer; pointer-events: auto; }
  .card:hover { filter: brightness(1.25); }
  .card.followed { box-shadow: inset 0 0 0 2px #fff; }
  #scoreboard { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
    font-family: "TF2 Build", "Oswald", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; }
  .sb-row { display: flex; align-items: stretch; filter: drop-shadow(0 2px 6px #000a); }
  .sb-team { position: relative; display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 54px; color: #fff; }
  .sb-team.blue { background: linear-gradient(180deg, color-mix(in srgb, var(--blue) 85%, #fff), var(--blue)); border-radius: 6px 0 0 6px; }
  .sb-team.red { background: linear-gradient(180deg, color-mix(in srgb, var(--red) 85%, #fff), var(--red)); border-radius: 0 6px 6px 0; }
  .sb-team b { font-size: 38px; font-weight: 800; line-height: 1; min-width: 1.2ch; text-align: center; text-shadow: 0 2px 0 #0006; font-variant-numeric: tabular-nums; }
  .sb-name { font-size: 12px; font-weight: 800; letter-spacing: .12em; opacity: .85; }
  .sb-sub { position: absolute; top: 100%; left: 0; right: 0; text-align: center; font-style: normal; font-size: 12px; font-weight: 700;
    background: #000a; padding: 1px 0; font-variant-numeric: tabular-nums; }
  .sb-sub:empty { display: none; }
  .sb-timer { position: relative; display: grid; place-items: center; width: 120px; background: #14161acc; color: #fff; }
  .sb-timer b { font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .sb-timer span { position: absolute; left: 0; right: 0; top: 3px; text-align: center; font-size: 9px; font-weight: 800; letter-spacing: .14em; color: #ffd166; line-height: 1; }
  .sb-timer.low b { color: #ff6b5a; }
  .sb-timer i { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font-style: normal; font-size: 9px;
    font-weight: 800; letter-spacing: .1em; line-height: 1; color: #ffffffb3; font-variant-numeric: tabular-nums; }
  .cps { display: flex; gap: 6px; }
  /* Square like TF2's HUD; a capture fills it left to right. */
  .cp { --own: #8a8a8a; --cap: transparent; --p: 0%; position: relative; width: 34px; height: 34px; border-radius: 4px;
    background: linear-gradient(90deg, var(--cap) var(--p), var(--own) var(--p)); box-shadow: 0 0 0 2px #000c, 0 2px 6px #0008;
    display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 800; text-shadow: 0 1px 2px #000; }
  .cp.locked { filter: grayscale(.7) brightness(.7); }
  .cp.locked::after { content: "🔒"; position: absolute; right: -6px; bottom: -6px; font-size: 11px; }
  .cp.capping { box-shadow: 0 0 0 2px #fff, 0 0 12px var(--cap); }
  #follow { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 8px;
    padding: 5px 6px 5px 12px; background: #0b0c0ee6; border-radius: 16px; color: var(--dim); }
  #follow b { color: #fff; }
  #follow button, #bgtoggle button { border: 0; font: inherit; cursor: pointer; }
  #follow button { width: 22px; height: 22px; border-radius: 50%; background: #ffffff1a; color: #fff; }
  html.noside aside { display: none; }
  html.noside main { grid-template-columns: 1fr; }
  #sidetoggle, #autozoom { position: absolute; right: 12px; z-index: 3; padding: 5px 10px; border: 0; border-radius: 6px;
    background: #0b0c0ee6; color: #fff; font: inherit; font-size: 12px; cursor: pointer; }
  #sidetoggle { top: 12px; font-size: 16px; line-height: 1; padding: 4px 9px; }
  #autozoom { bottom: 52px; }
  #bgtoggle { position: absolute; right: 12px; bottom: 12px; z-index: 3; display: flex; padding: 2px; border-radius: 6px; background: #0b0c0ee6; }
  #bgtoggle button { padding: 4px 10px; border-radius: 4px; background: transparent; color: var(--dim); font-size: 12px; }
  #bgtoggle button.on { background: #ffffff1f; color: #fff; }
  /* Broadcast overlay (/overlay): only the map, on a transparent page for OBS. */
  html.overlay, html.overlay body { background: transparent; }
  html.overlay body { display: block; }
  html.overlay header, html.overlay aside, html.overlay .hud, html.overlay #follow, html.overlay #bgtoggle, html.overlay #sidetoggle,
  html.overlay #empty, html.overlay #banner { display: none !important; }
  html.overlay main { display: block; height: 100%; }
  html.overlay #stage { position: fixed; inset: 0; border-radius: 14px; background: rgb(11 12 14 / var(--overlay-opacity, .82));
    box-shadow: inset 0 0 0 1px #ffffff1f; }
  html.overlay canvas { cursor: default; pointer-events: none; }
  html.overlay #scoreboard { top: 6px; transform: translateX(-50%) scale(.62); transform-origin: top center; }
  @keyframes pulse { from { opacity: 1; } to { opacity: .55; } }
  /* Moving exactly one 24px tile per cycle loops seamlessly. */
  @keyframes stripes { from { background-position: 0 0; } to { background-position: 24px 0; } }
  @media (max-width: 800px) { .hud { width: 150px; } .card .nm small, .card .tag { display: none; } }
  #feed, #chat { overflow-y: auto; flex: 1; min-height: 80px; }
  #feed div { padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat div { padding: 2px 0; overflow-wrap: anywhere; }
  #chat .notice { color: var(--dim); }
  #chat time { display: inline-block; min-width: 30px; color: var(--dim); font-size: 10px; font-variant-numeric: tabular-nums; }
  .t-red { color: var(--red); } .t-blue { color: var(--blue); }
  #feed div.ev { display: flex; align-items: center; gap: 5px; padding: 3px 7px; margin: 0 0 2px; border-radius: 3px;
    background: #0b0c0e8c; white-space: nowrap; overflow: hidden; }
  #feed .ev time { color: var(--dim); font-size: 10px; font-variant-numeric: tabular-nums; min-width: 30px; }
  #feed .ev .who { overflow: hidden; text-overflow: ellipsis; }
  #feed .who[data-id] { cursor: pointer; } #feed .who[data-id]:hover { text-decoration: underline; }
  #feed .ev.minor { background: transparent; color: var(--dim); font-size: 12px; }
  #feed .ev.feign { opacity: .5; }
  /* Round flow rows: team-coloured, bold, aligned like the rest and free to wrap. */
  #feed .ev.big { font-weight: 700; padding: 5px 7px; color: #fff; white-space: normal; }
  #feed .ev.big.red { background: color-mix(in srgb, var(--red) 55%, #000); }
  #feed .ev.big.blue { background: color-mix(in srgb, var(--blue) 55%, #000); }
  #feed .ev.big.none { background: #2c3036; }
  #feed .ev.hot.red { background: color-mix(in srgb, var(--red) 30%, #0b0c0e); }
  #feed .ev.hot.blue { background: color-mix(in srgb, var(--blue) 30%, #0b0c0e); }
  #feed .killicon { zoom: .6; margin: 0 2px; flex: none; }
  #feed .crit { filter: drop-shadow(0 0 3px #ff4b3a); }
  .chip { flex: none; padding: 0 4px; border-radius: 2px; font-size: 9px; font-weight: 800; letter-spacing: .06em; color: #000; background: #ddd; }
  .chip.dom { background: #ff6b5a; } .chip.rev { background: #ffd166; } .chip.air { background: #9ff0ff; } .chip.drop { background: #fff; }
  .w { color: var(--dim); font-size: 11px; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } }
</style>
</head>
<body>
<main>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="empty">waiting for SourceTV (data arrives tv_delay behind the game)…</div>
    <div id="banner"></div>
    <div class="hud" id="hud-blue"></div>
    <div class="hud" id="hud-red"></div>
    <div id="scoreboard" hidden>
      <div class="sb-row">
        <div class="sb-team blue"><span class="sb-name">BLU</span><b id="score-blue">0</b><i id="timer-blue" class="sb-sub"></i></div>
        <div class="sb-timer"><span id="round-label"></span><b id="timer-main"></b><i id="timer-map"></i></div>
        <div class="sb-team red"><b id="score-red">0</b><span class="sb-name">RED</span><i id="timer-red" class="sb-sub"></i></div>
      </div>
      <div class="cps" id="cps"></div>
    </div>
    <div id="follow" hidden><span>Following <b id="follow-name"></b></span><button id="follow-stop" title="Stop following (Esc)">✕</button></div>
    <button id="autozoom" hidden>Auto zoom</button>
    <button id="sidetoggle" title="Hide events and chat">›</button>
    <div id="bgtoggle" hidden><button data-bg="overview" class="on">Overview</button><button data-bg="geometry">Geometry</button></div>
  </div>
  <aside>
    <div id="title"><b id="map">connecting…</b><span id="status" class="bad">waiting for data</span><span id="age"></span></div>
    <section style="display:flex;flex-direction:column;flex:1.4;min-height:0"><div id="feed"></div></section>
    <section style="display:flex;flex-direction:column;flex:1;min-height:0"><h3>Chat</h3><div id="chat"></div></section>
  </aside>
</main>
<script>
"use strict";
const MS_PER_TICK = 15;
const BUFFER_TICKS = 10;
const TEAM = { red: "#d0453f", blue: "#4f8fc0", none: "#9a9a9a", spectator: "#9a9a9a" };
const CLASS = { scout: "Sc", soldier: "So", pyro: "Py", demoman: "De", heavy: "He", engineer: "En", medic: "Me", sniper: "Sn", spy: "Sp", unknown: "?" };
// logs.tf order, as on serveme; same-class players by name so rows don't swap between snapshots.
const CLASS_ORDER = ["scout", "soldier", "pyro", "demoman", "heavy", "engineer", "medic", "sniper", "spy", "unknown"];
const classRank = c => { const i = CLASS_ORDER.indexOf(c); return i < 0 ? CLASS_ORDER.length : i; };
const byClass = (a, b) => classRank(a.class) - classRank(b.class) || a.name.localeCompare(b.name, undefined, { sensitivity: "base" }) || a.id - b.id;

const ICONS = {};
for (const c of CLASS_ORDER) { if (c !== "unknown") { ICONS[c] = new Image(); ICONS[c].src = `/icons/${c}.svg`; } }
const icon = c => ICONS[c]?.complete && ICONS[c].naturalWidth ? ICONS[c] : null;

// /overlay: a fixed, transparent minimap for broadcasts. Options in the query string:
// names=1, score=1, panel=0..1 (background opacity), rotate=auto|<degrees>, dot=<px>.
const OVERLAY = location.pathname.startsWith("/overlay");
const OPT = new URLSearchParams(location.search);
if (OVERLAY) {
  document.documentElement.classList.add("overlay");
  if (OPT.has("panel")) document.documentElement.style.setProperty("--overlay-opacity", OPT.get("panel"));
}
// Marker size in the overlay follows the panel, so a corner minimap in a 1080p stream (~400px)
// stays readable: player dot radius ~12px there. ui=<factor> scales it, dot=<px> fixes it.
function overlayUnit() {
  if (OPT.has("dot")) return Number(OPT.get("dot")) || 12;
  const r = canvas.getBoundingClientRect();
  return Math.max(9, Math.min(20, Math.min(r.width, r.height) / 33)) * (Number(OPT.get("ui")) || 1);
}

// 1080p is the design size; 4K gets the same layout at twice the size.
function uiScale() { return OVERLAY ? 1 : Math.max(0.75, Math.min(2.5, innerHeight / 1080)); }
function applyScale() { document.documentElement.style.setProperty("--s", uiScale()); }
applyScale();
// A resize (or hiding the events) only refits the whole-map framing; auto zoom glides to it.
addEventListener("resize", () => { applyScale(); if (state.framed) frameMap(true); });

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);

const state = {
  map: null, snaps: [], events: [], effects: [], players: new Map(),
  tickOffset: null, lastTick: 0, geometry: null, geoCanvas: null, overview: null,
  view: { cx: 0, cy: 0, scale: 0.08, rot: 0 }, fitted: false,
  // Auto zoom on the fight; the main view turns it off when panned or zoomed by hand.
  autoZoom: !OVERLAY || OPT.get("zoom") !== "map", bg: "overview", follow: null,
};

// ---------- tick clock: server tick at a local instant, smoothed over snapshot arrivals
function nowTick() {
  return state.tickOffset == null ? 0 : performance.now() / MS_PER_TICK + state.tickOffset;
}
function observeTick(tick) {
  const est = tick - performance.now() / MS_PER_TICK;
  if (state.tickOffset == null || Math.abs(est - state.tickOffset) > 40) state.tickOffset = est;
  else state.tickOffset = Math.max(state.tickOffset * 0.97 + est * 0.03, state.tickOffset - 0.5);
}
function renderTick() { return nowTick() - BUFFER_TICKS; }

// ---------- incoming stream
const es = new EventSource("/events");
es.onmessage = e => handle(JSON.parse(e.data));
es.onerror = () => setStatus("stream lost, retrying", false);

function setStatus(text, ok) { const s = $("status"); s.textContent = text; s.className = ok ? "ok" : "bad"; }

// When the stream goes quiet (the match ended, or the page was opened afterwards), say how long ago
// the last data came in.
setInterval(() => {
  const age = state.lastData == null ? 0 : (performance.now() - state.lastData) / 1000;
  const t = age < 60 ? `${Math.floor(age)}s` : age < 3600 ? `${Math.floor(age / 60)}m ${Math.floor(age % 60)}s` : `${Math.floor(age / 3600)}h ${Math.floor(age / 60 % 60)}m`;
  $("age").textContent = age < 5 ? "" : `last data ${t} ago`;
  if (age >= 5 && $("status").textContent === "live") setStatus("no data", false);
}, 1000);

function handle(m) {
  // Feed events from before the page opened: straight into the feed and chat, no map effects.
  if (m.history) {
    const p = id => state.players.get(id);
    if (m.type === "chat") chat(m, p);
    else killiconsLoaded.finally(() => feedEvent(m, p));
    return;
  }
  switch (m.type) {
    case "server":
      if (m.map !== state.map) {
        if (state.map) feedEvent({ type: "map", map: m.map }, () => null);
        loadMap(m.map);
      }
      resetMatch();
      break;
    case "status":
      if (m.state === "map_change") { resetMatch(); setStatus("map changing", false); }
      else if (m.state === "full") setStatus("live", true);
      else if (m.state === "disconnected" || m.state === "connect_failed") setStatus(m.state + ": " + (m.reason || ""), false);
      else setStatus(m.state, false);
      break;
    case "data_age":
      state.lastData = performance.now() - m.ms;
      break;
    case "snapshot":
      if (m.tick < state.lastTick - 200) resetMatch();
      state.lastTick = m.tick;
      state.lastData = performance.now();
      if ($("status").textContent !== "live") setStatus("live", true);
      observeTick(m.tick);
      state.snaps.push(m);
      if (state.snaps.length > 60) state.snaps.shift();
      for (const p of m.players) state.players.set(p.id, p);
      $("empty").style.display = "none";
      break;
    case "world":
      break;
    default:
      state.events.push(m);
  }
}

// A map change (or a signon restart) starts from nothing: drop everything from the old map.
function resetMatch() {
  state.snaps = []; state.events = []; state.effects = []; state.tickOffset = null; state.lastTick = 0;
  state.players.clear(); lastPlayers = []; state.clock = ""; lastScores = null; spawnSeen = {};
  if (state.follow != null) setFollow(null);
  $("hud-blue").replaceChildren(); $("hud-red").replaceChildren(); hudNodes.clear(); $("cps").innerHTML = "";
  $("scoreboard").hidden = true;
}

// ---------- map backgrounds
let boundaries = null;
async function demostfBoundaries() {
  if (!boundaries) {
    try { boundaries = await (await fetch("https://maps.demos.tf/boundaries.json")).json(); }
    catch { boundaries = {}; }
  }
  return boundaries;
}
// demos.tf's own lookup: exact name, then names with version suffixes trimmed.
function demostfAlias(map, known) {
  const trim = m => { while (m.lastIndexOf("_") > m.indexOf("_")) m = m.slice(0, m.lastIndexOf("_")); return m; };
  if (map.startsWith("cp_gullywash_f") && !map.startsWith("cp_gullywash_final")) return "cp_gullywash_f6";
  if (known[map]) return map;
  const t = trim(map);
  if (known[t]) return t;
  for (const k of Object.keys(known)) if (trim(k) === map) return k;
  for (const k of Object.keys(known)) if (trim(k) === t) return k;
  return null;
}

async function loadMap(map) {
  state.map = map; state.geometry = null; state.geoCanvas = null; state.overview = null; state.fitted = false; state.framed = false;
  state.spawns = null; state.mapData = false;
  $("map").textContent = map;
  const known = await demostfBoundaries();
  const alias = demostfAlias(map, known);
  if (alias) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      state.overview = { img: OVERLAY ? withoutBlack(img) : img, b: known[alias] };

    // filled left to right in the capping team's colour while a capture is under way.
    const u = OVERLAY ? overlayUnit() : 0;
    const half = OVERLAY ? u * 1.2 : px(110, 11);
    const x0 = x - half, y0 = y - half, side = half * 2, corner = Math.max(2, half * 0.18);
    // Advance between snapshots at the rate stvmap extrapolates from the cap times and cappers.
    const progress = Math.max(0, Math.min(1, o.cap_progress + (o.cap_rate || 0) * Math.max(0, tick - snap.tick) * MS_PER_TICK / 1000));
    const capping = o.capping_team !== "none" && progress > 0;
    ctx.save();
    ctx.beginPath(); ctx.roundRect(x0, y0, side, side, corner);
    ctx.fillStyle = (TEAM[o.owner] || TEAM.none) + (OVERLAY ? "e6" : "99"); ctx.fill();
    if (capping) {
      ctx.save(); ctx.clip();
      ctx.fillStyle = TEAM[o.capping_team]; ctx.fillRect(x0, y0, side * progress, side);
      ctx.restore();
    }
    if (o.locked) { ctx.fillStyle = "#0b0c0e99"; ctx.fill(); }
    ctx.lineWidth = OVERLAY ? Math.max(2, u * 0.18) : 2;
    ctx.strokeStyle = capping ? "#fff" : "#0b0c0e"; ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `800 ${Math.round(OVERLAY ? u * 1.3 : Math.max(12 * uiScale(), half * 0.9))}px system-ui`;
    ctx.lineWidth = 3; ctx.strokeStyle = "#0b0c0e"; ctx.strokeText(String(o.index + 1), x, y + 1);
    ctx.fillText(String(o.index + 1), x, y + 1);
    ctx.restore();
  }
}

// S1-S3 / D1-D3 / T1-T3 like the engineer's HUD (MS for a mini-sentry); the sentry's aim
// sticks out, a teleporter exit gets a ring, and buildings under construction are faint.
function drawBuildings(snap) {
  for (const b of snap.buildings || []) {
    const [x, y] = toScreen(b.pos[0], b.pos[1]), s = OVERLAY ? overlayUnit() * 1.9 : px(44, 18);
    const label = b.kind === "sentry" && b.mini ? "MS" : (b.kind[0] || "?").toUpperCase() + (b.level || 1);
    ctx.save();
    if (b.building) ctx.globalAlpha = 0.55;
    if (b.kind === "sentry") {
      const target = b.attacking && b.target != null ? lastPlayers.find(p => p.id === b.target && p.alive && p.pos) : null;
      if (target) {
        const [tx, ty] = toScreen(target.pos[0], target.pos[1]);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty);
        ctx.setLineDash([6, 5]); ctx.strokeStyle = (TEAM[b.team] || "#fff") + "aa"; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
      }
      const a = screenAngle(b.aim ?? b.yaw ?? 0);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * s * 1.2, y + Math.sin(a) * s * 1.2);
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
    }
    ctx.fillStyle = TEAM[b.team] || TEAM.none;
    ctx.beginPath(); ctx.roundRect(x - s / 2, y - s / 2, s, s, 3); ctx.fill();
    ctx.lineWidth = b.sapped ? 2.5 : 1.5; ctx.strokeStyle = b.sapped ? "#fff" : "#000"; ctx.stroke();
    if (b.kind === "teleporter" && b.entrance === false) {
      ctx.beginPath(); ctx.arc(x, y, s * 0.72, 0, Math.PI * 2); ctx.strokeStyle = TEAM[b.team] || "#fff"; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.fillStyle = "#fff"; ctx.font = `800 ${Math.round(Math.max(9, s * 0.5))}px system-ui`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(label, x, y + 0.5);
    if (b.sapped) { ctx.fillStyle = "#fff"; ctx.font = `800 ${Math.round(9 * uiScale())}px system-ui`; ctx.fillText("SAPPED", x, y + s / 2 + 7); }
    ctx.restore();
  }
}

function drawProjectiles(list) {
  // The overlay sizes projectiles from its panel like the players, a little larger than their
  // usual minimum, so they read at minimap scale.
  const size = (units, min) => (OVERLAY ? (min * overlayUnit()) / 9 : px(units, min));
  for (const p of list || []) {
    const [x, y] = toScreen(p.pos[0], p.pos[1]);
    const col = TEAM[p.team] || "#ccc";
    // Rockets and arrows face their flight (the networked yaw is exact); grenades tumble.
    const deg = p.kind === "Rocket" || p.kind.endsWith("Arrow") ? p.yaw : p.heading ?? p.yaw ?? 0;
    const a = screenAngle(deg);
    ctx.save();
    ctx.translate(x, y);
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#000"; ctx.lineWidth = 1.2;
    if (p.crit) { ctx.shadowColor = col; ctx.shadowBlur = 10; }
    switch (p.kind) {
      case "Rocket": {
        ctx.rotate(a);
        const l = size(26, 12), w = l * 0.32;
        const trail = ctx.createLinearGradient(-l * 3.2, 0, -l * 0.5, 0);
        trail.addColorStop(0, "#ffffff00"); trail.addColorStop(1, "#ffd9a0aa");
        ctx.fillStyle = trail; ctx.fillRect(-l * 3.2, -w * 0.35, l * 2.7, w * 0.7);
        ctx.beginPath(); ctx.moveTo(l * 0.6, 0); ctx.lineTo(-l * 0.5, -w); ctx.lineTo(-l * 0.5, w); ctx.closePath();
        ctx.fillStyle = p.crit ? "#fff" : col; ctx.fill(); ctx.stroke();
        break;
      }
      case "Pipe": case "LooseCannon": {
        const r = size(9, 4.5);
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = p.crit ? "#fff" : col; ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2); ctx.fillStyle = "#0008"; ctx.fill();
        break;
      }
      case "Sticky": {
        const r = size(10, 6);
        ctx.beginPath();
        for (let i = 0; i < 16; i++) {
          const rr = i % 2 ? r * 0.55 : r * 1.15, t = i / 16 * Math.PI * 2;
          (i ? ctx.lineTo : ctx.moveTo).call(ctx, Math.cos(t) * rr, Math.sin(t) * rr);
        }
        ctx.closePath(); ctx.fillStyle = p.crit ? "#fff" : col; ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
        break;
      }
      case "Arrow": case "HealingArrow": {
        ctx.rotate(a);
        const l = size(34, 18);
        ctx.beginPath(); ctx.moveTo(-l * 0.6, 0); ctx.lineTo(l * 0.4, 0);
        ctx.strokeStyle = "#000"; ctx.lineWidth = 3.5; ctx.stroke();
        ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(l * 0.6, 0); ctx.lineTo(l * 0.3, -l * 0.16); ctx.lineTo(l * 0.3, l * 0.16); ctx.closePath();
        ctx.fillStyle = "#fff"; ctx.fill(); ctx.strokeStyle = "#000"; ctx.lineWidth = 1; ctx.stroke();
        if (p.kind === "HealingArrow") {
          ctx.rotate(-a); ctx.fillStyle = "#7dff8a";
          ctx.fillRect(-l * 0.32, -1.5, l * 0.3, 3); ctx.fillRect(-l * 0.32 + l * 0.15 - 1.5, -l * 0.15, 3, l * 0.3);
        }
        break;
      }
      case "Flare": case "Fireball": {
        ctx.beginPath(); ctx.arc(0, 0, size(9, 3.5), 0, Math.PI * 2);
        ctx.fillStyle = "#ffb347"; ctx.shadowColor = "#ff7a00"; ctx.shadowBlur = 12; ctx.fill();
        break;
      }
      case "EnergyBall": case "EnergyRing": case "ShortCircuitOrb": {
        ctx.beginPath(); ctx.arc(0, 0, size(12, 4.5), 0, Math.PI * 2);
        ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.shadowColor = col; ctx.shadowBlur = 12; ctx.stroke();
        break;
      }
      case "Jarate": case "MadMilk": case "GasPasser": case "Cleaver": {
        const r = size(9, 4);
        ctx.rotate(Math.PI / 4); ctx.fillStyle = p.kind === "Jarate" ? "#ffe14a" : p.kind === "MadMilk" ? "#f4f4f4" : p.kind === "GasPasser" ? "#ff9a3c" : "#bbb";
        ctx.fillRect(-r, -r, r * 2, r * 2); ctx.strokeRect(-r, -r, r * 2, r * 2);
        break;
      }
      default: {
        ctx.beginPath(); ctx.arc(0, 0, size(8, 3), 0, Math.PI * 2);
        ctx.fillStyle = col; ctx.fill(); ctx.stroke();
      }
    }
    ctx.restore();
  }
}

// ---------- spawn rooms: which are in use
// A spawn point tied to a control point is enabled for its team while that team owns the
// point (TF2's rule); untied ones always are. Of the enabled rooms a team spawns in the most
// forward one: the one farthest from its main spawn (the room with the most spawn points).
// Once a team has been seen spawning since the last change of ownership, that room wins.
let spawnSeen = {}, ownersKey = "", ownersChanged = 0;
const inRoom = (r, p) => p[0] >= r.min[0] && p[0] <= r.max[0] && p[1] >= r.min[1] && p[1] <= r.max[1] && p[2] >= r.min[2] - 64 && p[2] <= r.max[2] + 64;
const centre = r => [(r.min[0] + r.max[0]) / 2, (r.min[1] + r.max[1]) / 2];
function noteSpawn(ev) {
  const rooms = state.spawns?.rooms || [];
  const i = ev.pos ? rooms.findIndex(r => r.team === ev.team && inRoom(r, ev.pos)) : -1;
  if (i >= 0) spawnSeen[ev.team] = { room: i, at: performance.now() };
}
function activeRooms(snap) {
  const s = state.spawns;
  if (!s) return new Set();
  const owner = {};
  for (const o of snap.objectives || []) if (o.kind === "control_point") owner[o.index] = o.owner;
  const key = JSON.stringify(owner);
  if (key !== ownersKey) { ownersKey = key; ownersChanged = performance.now(); }
  const live = s.points.filter(p => !p.disabled && (p.point == null || owner[p.point] === undefined || owner[p.point] === p.team));
  const active = new Set();
  for (const team of ["red", "blue"]) {
    const seen = spawnSeen[team];
    if (seen && seen.at >= ownersChanged) { active.add(seen.room); continue; }
    const rooms = s.rooms.map((r, i) => ({ r, i, n: s.points.filter(p => p.team === team && inRoom(r, p.pos)).length })).filter(x => x.r.team === team);
    const main = rooms.reduce((a, b) => (b.n > (a?.n ?? -1) ? b : a), null);
    if (!main) continue;
    const enabled = rooms.filter(x => !x.r.disabled && live.some(p => p.team === team && inRoom(x.r, p.pos)));
    const far = x => Math.hypot(centre(x.r)[0] - centre(main.r)[0], centre(x.r)[1] - centre(main.r)[1]);
    const pick = enabled.reduce((a, b) => (!a || far(b) > far(a) ? b : a), null);
    if (pick) active.add(pick.i);
  }
  return active;
}
function drawSpawnRooms(snap) {
  const rooms = state.spawns?.rooms;
  if (!rooms?.length) return;
  const active = activeRooms(snap);
  rooms.forEach((r, i) => {
    if (OVERLAY && !active.has(i)) return;
    const corners = [[r.min[0], r.min[1]], [r.max[0], r.min[1]], [r.max[0], r.max[1]], [r.min[0], r.max[1]]].map(([x, y]) => toScreen(x, y));
    const col = TEAM[r.team] || "#999";
    ctx.save();
    ctx.beginPath(); corners.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
    if (active.has(i)) {
      ctx.fillStyle = col + "2e"; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = OVERLAY ? 1.5 : 2; ctx.stroke();
      const top = corners.reduce((a, b) => (b[1] < a[1] || (b[1] === a[1] && b[0] < a[0]) ? b : a));
      if (!OVERLAY && Math.hypot(corners[1][0] - corners[0][0], corners[1][1] - corners[0][1]) > 40) {
        ctx.fillStyle = col; ctx.font = `800 ${Math.round(10 * uiScale())}px system-ui`; ctx.textAlign = "left"; ctx.textBaseline = "top";
        ctx.fillText("SPAWN", top[0] + 4, top[1] + 3);
      }
    } else {
      ctx.setLineDash([4, 4]); ctx.strokeStyle = col + "66"; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.restore();
  });
}

// Each charge looks different: über a solid team glow, kritz crackling, quick-fix
// pulsing rings, vaccinator a shield with its resistance.
function drawUberRing(p, x, y, rad, col) {
  const t = performance.now() / 1000;
  ctx.save();
  if (p.ubered === "uber") {
    ctx.beginPath(); ctx.arc(x, y, rad + 7, 0, Math.PI * 2);
    ctx.fillStyle = col + "90"; ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.fill();
  } else if (p.ubered === "kritz") {
    ctx.beginPath();
    for (let i = 0; i <= 24; i++) {
      const a = i / 24 * Math.PI * 2 + t * 3, r = rad + 6 + (i % 2 ? 4 : -1) + Math.sin(t * 20 + i) * 1.5;
      (i ? ctx.lineTo : ctx.moveTo).call(ctx, x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.strokeStyle = "#fff"; ctx.shadowColor = col; ctx.shadowBlur = 10; ctx.lineWidth = 2; ctx.stroke();
  } else if (p.ubered === "quickfix") {
    for (let i = 0; i < 2; i++) {
      const k = (t * 1.2 + i / 2) % 1;
      ctx.beginPath(); ctx.arc(x, y, rad + 4 + k * 16, 0, Math.PI * 2);
      ctx.strokeStyle = col; ctx.globalAlpha = 1 - k; ctx.lineWidth = 3; ctx.stroke();
    }
  } else {
    ctx.beginPath(); ctx.arc(x, y, rad + 7, -Math.PI * 0.8, -Math.PI * 0.2);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.shadowColor = col; ctx.shadowBlur = 12; ctx.stroke();
    ctx.shadowBlur = 0; ctx.font = `bold ${Math.round(10 * uiScale())}px system-ui`; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillStyle = "#fff"; ctx.fillText(p.ubered.split("_")[1].toUpperCase(), x, y - rad - 9);
  }
  ctx.restore();
}

function drawHealBeams(players, byId) {
  for (const m of players) {
    const g = m.medigun;
    if (!m.alive || !g || g.target == null) continue;
    const t = byId.get(g.target);
    if (!t || !t.alive) continue;
    const [x0, y0] = toScreen(m.pos[0], m.pos[1]), [x1, y1] = toScreen(t.pos[0], t.pos[1]);
    ctx.save();
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
    ctx.strokeStyle = TEAM[m.team]; ctx.globalAlpha = g.releasing ? 0.95 : 0.6;
    ctx.lineWidth = g.releasing ? 6 : 3; ctx.lineCap = "round";
    if (g.releasing) { ctx.shadowColor = TEAM[m.team]; ctx.shadowBlur = 14; }
    ctx.setLineDash([10, 6]); ctx.lineDashOffset = -performance.now() / 25;
    ctx.stroke();
    ctx.restore();
  }
}

function drawPlayers(players) {
  const alive = [];
  // The followed player is drawn last, so their dot and name are on top.
  players = [...players].sort((a, b) => (a.id === state.follow) - (b.id === state.follow));
  for (const p of players) {
    if (p.team !== "red" && p.team !== "blue") continue;
    if (!p.alive) {
      // The overlay keeps an X where each dead player fell until they respawn, like a CS radar.
      if (OVERLAY && p.pos) {
        const [x, y] = toScreen(p.pos[0], p.pos[1]), s = overlayUnit() * 0.6;
        ctx.save(); ctx.globalAlpha = 0.75; ctx.lineCap = "round";
        ctx.strokeStyle = "#000"; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke();
        ctx.strokeStyle = TEAM[p.team]; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.restore();
      }
      continue;
    }
    const [x, y] = toScreen(p.pos[0], p.pos[1]);
    alive.push({ p, x, y, rad: playerRad(), col: TEAM[p.team], cloaked: p.conds?.includes("Stealthed") });
  }
  // In passes, so in a clump every class icon sits on top of the other players' discs.
  for (const { p, x, y, rad, col, cloaked } of alive) {
    ctx.globalAlpha = cloaked ? 0.35 : 1;
    const a = screenAngle(p.yaw);
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.arc(x, y, rad * 2.6, a - 0.35, a + 0.35); ctx.closePath();
    ctx.fillStyle = col + "40"; ctx.fill();
  }
  for (const { p, x, y, rad, col, cloaked } of alive) {
    ctx.globalAlpha = cloaked ? 0.35 : 1;
    if (p.ubered) drawUberRing(p, x, y, rad, col);
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = OVERLAY ? Math.max(1.5, rad * 0.16) : 1.5; ctx.strokeStyle = "#000"; ctx.stroke();
    const max = p.max_hp || 1, frac = Math.max(0, Math.min(1, p.hp / max));
    const ring = (from, to, color) => {
      ctx.beginPath(); ctx.arc(x, y, rad + 2.5, -Math.PI / 2 + Math.PI * 2 * from, -Math.PI / 2 + Math.PI * 2 * to);
      ctx.strokeStyle = color; ctx.stroke();
    };
    ctx.lineWidth = OVERLAY ? Math.max(2.5, rad * 0.26) : 2.5;
    ring(0, frac, frac > 0.5 ? "#9fd27f" : frac > 0.25 ? "#e0c040" : "#e05a40");
    // Overheal laps the green ring in blue, full at the medigun cap: +50%, rounded down to 5.
    const over = Math.min(1, (p.hp - max) / (Math.floor(max * 1.5 / 5) * 5 - max || 1));
    if (over > 0) ring(0, over, "#1f4fe0");
  }
  // Flames over the dots, so they show in a fight, but under the class icons.
  for (const { p, x, y, rad } of alive) if (p.flames) drawFlames(p, x, y, rad, screenAngle(p.yaw));
  for (const { p, x, y, rad, cloaked } of alive) {
    ctx.globalAlpha = cloaked ? 0.35 : 1;
    const img = icon(p.class);
    if (img) {
      const s = rad * 1.65;
      ctx.drawImage(img, x - s / 2, y - s / 2, s, s);
    } else {
      ctx.fillStyle = "#fff"; ctx.font = `bold ${Math.round(Math.max(9, rad * 0.9))}px system-ui`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(CLASS[p.class] || "?", x, y + 0.5);
    }
    if (p.id === state.follow) {
      ctx.beginPath(); ctx.arc(x, y, rad + 7, 0, Math.PI * 2); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  for (const { p, x, y, rad, cloaked } of alive) {
    ctx.globalAlpha = cloaked ? 0.35 : 1;
    if (!OVERLAY || OPT.get("names") === "1") {
      const size = OVERLAY ? Math.round(Math.max(11, rad * 0.95)) : Math.round(12 * uiScale());
      ctx.font = `700 ${size}px system-ui`; ctx.textBaseline = "top"; ctx.textAlign = "center";
      const label = p.name.slice(0, OVERLAY ? 12 : 18), ly = y + rad + 4;
      ctx.lineWidth = 3; ctx.strokeStyle = "#0b0c0e"; ctx.strokeText(label, x, ly);
      ctx.fillStyle = "#e8e8e8"; ctx.fillText(label, x, ly);
    }
  }
  ctx.globalAlpha = 1;
}

// A firing flamethrower: a flickering cone about as long as the flames reach. Crit flames take
// the team's colour, and burn brighter while they hit someone.
function drawFlames(p, x, y, rad, a) {
  const t = performance.now() / 1000, len = Math.max(350 * state.view.scale, rad * (OVERLAY ? 4 : 3)) * (0.92 + 0.08 * Math.sin(t * 23 + p.id));
  const hot = p.flames.crit ? (p.team === "red" ? "255,90,60" : "90,160,255") : "255,150,40";
  const g = ctx.createRadialGradient(x, y, rad + 3, x, y, len);
  g.addColorStop(0, `rgba(${hot},${p.flames.hit ? 0.85 : 0.6})`);
  g.addColorStop(1, `rgba(${hot},0)`);
  ctx.beginPath(); ctx.arc(x, y, rad + 3, a + 0.3, a - 0.3, true); ctx.arc(x, y, len, a - 0.3, a + 0.3); ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
}

function drawEffects(byId) {
  const now = performance.now();
  state.effects = state.effects.filter(e => now - e.t0 < e.life);
  for (const e of state.effects) {
    const k = (now - e.t0) / e.life;
    ctx.globalAlpha = 1 - k;
    if (e.kind === "shot") {
      const [x, y] = toScreen(e.ev.origin[0], e.ev.origin[1]);
      const a = screenAngle(e.ev.yaw), len = 900 * Math.cos(e.ev.pitch * Math.PI / 180) * state.view.scale;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
      ctx.strokeStyle = e.team === "red" ? "#ffb3a8" : e.team === "blue" ? "#b3dcff" : "#ffe9a8"; ctx.lineWidth = 1.2; ctx.stroke();
    } else if (e.kind === "sentryshot") {
      const [x, y] = toScreen(e.from[0], e.from[1]);
      const t = byId.get(e.target);
      let [tx, ty] = [0, 0];
      if (t?.pos) [tx, ty] = toScreen(t.pos[0], t.pos[1]);
      else { const a = screenAngle(e.aim || 0); [tx, ty] = [x + Math.cos(a) * 1100 * state.view.scale, y + Math.sin(a) * 1100 * state.view.scale]; }
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty);
      ctx.strokeStyle = "#ffe9a8"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, px(14, 5), 0, Math.PI * 2); ctx.fillStyle = "#ffd36a"; ctx.fill();
    } else if (e.kind === "boom") {
      const [x, y] = toScreen(e.ev.origin[0], e.ev.origin[1]);
      ctx.beginPath(); ctx.arc(x, y, Math.max(px(146, 6), OVERLAY ? overlayUnit() * 1.2 : 0) * (0.35 + 0.65 * k), 0, Math.PI * 2);
      ctx.fillStyle = "#ffa04040"; ctx.fill(); ctx.strokeStyle = "#ffb050"; ctx.lineWidth = 2; ctx.stroke();
    } else if (e.kind === "dmg" && !OVERLAY) {
      const pos = byId.get(e.ev.victim)?.pos || e.pos;
      if (!pos) continue;
      const [x, y] = toScreen(pos[0], pos[1]);
      ctx.font = `bold ${Math.round((e.ev.crit ? 15 : 12) * uiScale())}px system-ui`; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillStyle = e.ev.crit ? "#7dff6a" : e.ev.minicrit ? "#ffd04a" : "#ff5a4a";
      ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
      const ty = y - playerRad() - 4 - k * 22;
      ctx.strokeText("-" + e.ev.amount, x, ty); ctx.fillText("-" + e.ev.amount, x, ty);
    } else if (e.kind === "kill" && !OVERLAY) {
      const v = e.ev.victim_pos;
      if (!v) continue;
      const [x, y] = toScreen(v[0], v[1]), s = 7;
      if (e.ev.attacker_pos && e.ev.attacker !== e.ev.victim) {
        const [ax, ay] = toScreen(e.ev.attacker_pos[0], e.ev.attacker_pos[1]);
        ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(x, y);
        ctx.strokeStyle = "#fff8"; ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
      }
      ctx.strokeStyle = TEAM[e.team] || "#fff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke();
    } else if (e.kind === "spawn" && e.pos) {
      const [x, y] = toScreen(e.pos[0], e.pos[1]);
      ctx.beginPath(); ctx.arc(x, y, playerRad() + k * 18, 0, Math.PI * 2); ctx.strokeStyle = TEAM[e.team] || "#fff"; ctx.lineWidth = 2; ctx.stroke();
    } else if (e.kind === "airblast") {
      // A puff of air widening out in front of the pyro.
      const pl = byId.get(e.id); if (!pl?.pos) continue;
      const [x, y] = toScreen(pl.pos[0], pl.pos[1]), a = screenAngle(pl.yaw);
      const rad = playerRad(), r = Math.max((40 + 220 * k) * state.view.scale, rad * (1.4 + 2 * k));
      ctx.beginPath(); ctx.arc(x, y, rad + 3, a + 0.7, a - 0.7, true); ctx.arc(x, y, r, a - 0.7, a + 0.7); ctx.closePath();
      ctx.fillStyle = "#e8f4ff30"; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, r, a - 0.7, a + 0.7);
      ctx.strokeStyle = "#e8f4ff"; ctx.lineWidth = Math.max(3, rad * 0.35); ctx.lineCap = "round"; ctx.stroke(); ctx.lineCap = "butt";
    } else if (e.kind === "uber") {
      const m = byId.get(e.id); if (!m?.pos) continue;
      const [x, y] = toScreen(m.pos[0], m.pos[1]);
      ctx.beginPath(); ctx.arc(x, y, playerRad() + 6 + k * 50, 0, Math.PI * 2); ctx.strokeStyle = TEAM[e.team]; ctx.lineWidth = 4; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- HUD and header, refreshed a few times per second
const UBER_LABEL = { uber: "ÜBER", kritz: "KRITZ", quickfix: "QUICK-FIX", vaccinator_bullet: "VACC · BULLET", vaccinator_blast: "VACC · BLAST", vaccinator_fire: "VACC · FIRE" };
const MEDIGUN_NAME = { medigun: "Medi Gun", kritzkrieg: "Kritzkrieg", quickfix: "Quick-Fix", vaccinator: "Vaccinator" };

// Cards and meters are kept and updated in place: rebuilding them would restart their
// animations (the über stripes) several times a second.
const hudNodes = new Map();
function node(key, html) {
  let el = hudNodes.get(key);
  if (!el) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    el = t.content.firstElementChild;
    hudNodes.set(key, el);
  }
  return el;
}
function setHTML(el, html) { if (el.innerHTML !== html) el.innerHTML = html; }
function setClass(el, cls) { if (el.className !== cls) el.className = cls; }
function setStyle(el, prop, value) { if (el.style[prop] !== value) el.style[prop] = value; }

function card(p) {
  const el = node(`p${p.id}`, `<div class="card"><div class="fill"></div><span class="ci"></span><div class="nm"><b></b><small></small></div><div class="hp"></div></div>`);
  const f = p.alive ? Math.max(0, Math.min(1, p.hp / (p.max_hp || 1))) : 0;
  if (el.dataset.id !== String(p.id)) el.dataset.id = p.id;
  setClass(el, ["card", p.id === state.follow && "followed", !p.alive && "dead", p.alive && p.hp > p.max_hp && "over", p.alive && f < 0.35 && "low", p.ubered && "ub"].filter(Boolean).join(" "));
  setStyle(el.children[0], "clipPath", `inset(0px ${(100 - f * 100).toFixed(1)}% 0px 0px)`);
  setHTML(el.children[1], ICONS[p.class] ? `<img src="/icons/${p.class}.svg" alt="${p.class}">` : CLASS[p.class] || "?");
  setText2(el.querySelector(".nm b"), p.name);
  const sub = [p.ping != null && `${p.ping} ms`, p.class === "medic" && `${p.uber ?? 0}% über`].filter(Boolean).join(" · ");
  setHTML(el.querySelector(".nm small"), `${p.ubered ? `<span class="tag">${UBER_LABEL[p.ubered] || "ÜBER"}</span>` : ""}${sub}`);
  setText2(el.children[3], p.alive ? String(p.hp) : "DEAD");
  return el;
}
function chargeMeter(p) {
  const el = node(`c${p.id}`, `<div class="charge"><div class="bar"></div><i class="segs"></i><span></span><span style="opacity:.75"></span><span class="pct"></span></div>`);
  const g = p.medigun || { kind: "medigun" };
  const pct = Math.round(p.uber ?? 0);
  setClass(el, ["charge", !p.alive && "dead", g.releasing && "releasing", !g.releasing && pct >= 100 && "ready"].filter(Boolean).join(" "));
  setStyle(el.children[0], "clipPath", `inset(0px ${100 - pct}% 0px 0px)`);
  // The Vaccinator charges in four 25% pips; the others in one bar.
  setHTML(el.children[1], g.kind === "vaccinator" ? [25, 50, 75].map(x => `<i class="seg" style="left:${x}%"></i>`).join("") : "");
  setText2(el.children[2], g.releasing ? "ACTIVE" : pct >= 100 ? "READY" : "ÜBERCHARGE");
  setText2(el.children[3], (MEDIGUN_NAME[g.kind] || g.kind) + (g.kind === "vaccinator" && g.resist ? ` · ${g.resist}` : ""));
  setText2(el.children[4], `${pct}%`);
  return el;
}
function setText2(el, text) { if (el.textContent !== text) el.textContent = text; }
function placeChildren(box, nodes) {
  // Only touch the DOM order when it changed: moving a node restarts its animations too.
  const same = box.children.length === nodes.length && nodes.every((n, i) => box.children[i] === n);
  if (!same) box.replaceChildren(...nodes);
}

let lastPanel = 0;
function updatePanel(players, snap) {
  const now = performance.now();
  if (now - lastPanel < 250) return;
  lastPanel = now;
  for (const team of ["blue", "red"]) {
    const list = players.filter(p => p.team === team).sort(byClass);
    placeChildren($("hud-" + team), [...list.map(card), ...list.filter(p => p.class === "medic").map(chargeMeter)]);
  }
  renderPoints(snap);
}

// ---------- TF2-style scoreboard: team scores, round timer, control points
const ROUND_LABEL = { pregame: "WARMUP", preround: "GET READY", team_win: "ROUND OVER", stalemate: "STALEMATE", game_over: "GAME OVER", bonus: "BONUS", between_rounds: "", restart: "", running: "" };
function clock(secs) {
  const s = Math.max(0, Math.ceil(secs));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function mmss(secs) { return `${Math.floor(secs / 60)}:${String(Math.floor(secs % 60)).padStart(2, "0")}`; }
function setText(id, text) { const el = $(id); if (el.textContent !== text) el.textContent = text; }
function renderScoreboard(snap, tick) {
  $("scoreboard").hidden = OVERLAY && OPT.get("score") !== "1";
  setText("score-blue", String(snap.score?.blue ?? 0));
  setText("score-red", String(snap.score?.red ?? 0));
  const timers = snap.timers || [];
  const left = t => t.paused ? t.remaining : t.remaining - Math.max(0, tick - snap.tick) * MS_PER_TICK / 1000;
  const main = timers.find(t => t.team === "none") || (timers.length === 1 ? timers[0] : null);
  const byTeam = team => timers.find(t => t.team === team && t !== main);
  // Like TF2's HUD: the round timer when one is active, else the map's mp_timelimit; with
  // both, the map time goes underneath.
  const mapLeft = snap.time_left == null ? null : snap.time_left - Math.max(0, tick - snap.tick) * MS_PER_TICK / 1000;
  setText("timer-main", main ? clock(left(main)) : mapLeft != null ? clock(mapLeft) : "");
  setText("timer-map", main && mapLeft != null ? `MAP ${clock(mapLeft)}` : "");
  // Events are stamped with time into the round, which (unlike the round timer) never jumps.
  const into = snap.round_time == null ? null : snap.round_time + (snap.round === "running" ? Math.max(0, tick - snap.tick) * MS_PER_TICK / 1000 : 0);
  state.clock = into == null ? "" : mmss(into);
  setText("timer-blue", byTeam("blue") ? clock(left(byTeam("blue"))) : "");
  setText("timer-red", byTeam("red") ? clock(left(byTeam("red"))) : "");
  const label = main?.setup ? "SETUP" : ROUND_LABEL[snap.round] ?? "";
  // A paused round timer is not a paused game (KotH, no match started): it just stands still.
  setText("round-label", label || (main && !main.paused && left(main) <= 0 ? "OVERTIME" : ""));
  const shown = main && !main.paused ? left(main) : !main ? mapLeft : null;
  $("timer-main").parentElement.classList.toggle("low", shown != null && shown <= 30);
}
function renderPoints(snap) {
  const html = (snap.objectives || []).filter(o => o.kind === "control_point").map(o => {
    const capping = o.capping_team !== "none" && o.cap_progress > 0;
    const style = `--own:${TEAM[o.owner] || "#8a8a8a"};--cap:${capping ? TEAM[o.capping_team] : "transparent"};--p:${Math.round((capping ? o.cap_progress : 0) * 100)}%`;
    return `<div class="cp${o.locked ? " locked" : ""}${capping ? " capping" : ""}" style="${style}">${o.index + 1}</div>`;
  }).join("");
  if ($("cps").innerHTML !== html) $("cps").innerHTML = html;
}

function frame() {
  try { draw(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

// Auto zoom frames the fight: clumps of players first. A player on their own joins the
// framing only after STRAGGLE_MS (a respawn usually rejoins by then) and is then brought in
// slowly. The camera holds its framing until the fight leaves it or tightens a lot, and
// glides: never wider than the full framing, never tighter than MIN_SPAN units.
const MIN_SPAN = 2600, ACTION_PAD = 500, CLUMP_LINK = 1500, STRAGGLE_MS = 3000;
const straggling = new Map();
let lastFrame = performance.now();

// Players linked within CLUMP_LINK of each other form a clump; keep the biggest one and any
// other clump of three or more.
function fightingPlayers(alive) {
  const group = alive.map((_, i) => i);
  const root = i => (group[i] === i ? i : (group[i] = root(group[i])));
  for (let i = 0; i < alive.length; i++)
    for (let j = i + 1; j < alive.length; j++)
      if (Math.hypot(alive[i].pos[0] - alive[j].pos[0], alive[i].pos[1] - alive[j].pos[1]) < CLUMP_LINK) group[root(i)] = root(j);
  const sizes = new Map();
  alive.forEach((_, i) => sizes.set(root(i), (sizes.get(root(i)) || 0) + 1));
  const biggest = Math.max(...sizes.values());
  return alive.filter((_, i) => sizes.get(root(i)) === biggest || sizes.get(root(i)) >= 3);
}

function followAction(players) {
  const now = performance.now(), dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  const v = state.view, full = state.full;
  if (!full) return;
  const { w, h } = viewArea(), c = Math.cos(v.rot), sn = Math.sin(v.rot);
  const toUV = p => [p[0] * c - p[1] * sn, p[0] * sn + p[1] * c];
  const alive = players.filter(p => p.alive && p.pos && (p.team === "red" || p.team === "blue"));
  const fight = alive.length ? fightingPlayers(alive) : [];
  const loners = alive.filter(p => !fight.includes(p));
  for (const id of straggling.keys()) if (!loners.some(p => p.id === id)) straggling.delete(id);
  for (const p of loners) if (!straggling.has(p.id)) straggling.set(p.id, now);
  const framed = [...fight, ...loners.filter(p => now - straggling.get(p.id) > STRAGGLE_MS)];
  let wanted = { ...full };
  if (framed.length) {
    // Along the rotated axes, like the framing, so the box matches the panel.
    const uv = framed.map(p => toUV(p.pos));
    let u0 = Math.min(...uv.map(p => p[0])) - ACTION_PAD, u1 = Math.max(...uv.map(p => p[0])) + ACTION_PAD;
    let v0 = Math.min(...uv.map(p => p[1])) - ACTION_PAD, v1 = Math.max(...uv.map(p => p[1])) + ACTION_PAD;
    const grow = (a, b) => { const m = (a + b) / 2, half = Math.max((b - a) / 2, MIN_SPAN / 2); return [m - half, m + half]; };
    [u0, u1] = grow(u0, u1); [v0, v1] = grow(v0, v1);
    const scale = Math.max(full.scale, Math.min(w / (u1 - u0), h / (v1 - v0)) * 0.96);
    const uc = (u0 + u1) / 2, vc = (v0 + v1) / 2;
    wanted = { cx: uc * c + vc * sn, cy: -uc * sn + vc * c, scale };
  }
  // Hold the current framing while it still works: everyone fighting is well inside it, the
  // action has not shifted by a quarter view and there is no big zoom-in to gain.
  const hold = state.camTarget;
  let keep = false;
  if (hold) {
    const [hu, hv] = toUV([hold.cx, hold.cy]), halfW = w / 2 / hold.scale, halfH = h / 2 / hold.scale;
    const inView = p => { const [pu, pv] = toUV(p.pos); return Math.abs(pu - hu) < halfW * 0.8 && Math.abs(pv - hv) < halfH * 0.8; };
    const [wu, wv] = toUV([wanted.cx, wanted.cy]);
    const shifted = Math.abs(wu - hu) > halfW * 0.5 || Math.abs(wv - hv) > halfH * 0.5;
    const fightInside = fight.every(inView);
    keep = framed.length > 0 && framed.every(inView) && !shifted && wanted.scale < hold.scale * 1.4;
    // Only a straggler is out of view: bring them in, but slowly.
    wanted.slow = fightInside && !shifted;
  }
  if (!keep) state.camTarget = wanted;
  const target = state.camTarget;
  // A critically damped spring keeps the camera's speed continuous; zooming out (someone is
  // about to leave the frame) is quicker than zooming in.
  const cam = (state.cam ??= { vx: 0, vy: 0, vz: 0 }), pan = target.slow ? 3.5 : 1.6;
  const focusCy = v.cy - viewArea().top / 2 / v.scale;
  let fy;
  [v.cx, cam.vx] = smoothDamp(v.cx, target.cx, cam.vx, pan, dt);
  [fy, cam.vy] = smoothDamp(focusCy, target.cy, cam.vy, pan, dt);
  let z = Math.log(v.scale);
  const zoomOut = target.slow ? 3.5 : 1.4;
  [z, cam.vz] = smoothDamp(z, Math.log(target.scale), cam.vz, target.scale < v.scale ? zoomOut : 3, dt);
  v.scale = Math.exp(z);
  v.cy = viewCy(fy, v.scale);
}

// Unity-style SmoothDamp: moves `x` toward `to` with velocity `vel`, settling in about `time` s.
function smoothDamp(x, to, vel, time, dt) {
  const w = 2 / time, e = w * dt, decay = 1 / (1 + e + 0.48 * e * e + 0.235 * e * e * e);
  const change = x - to, temp = (vel + w * change) * dt;
  const v = (vel - w * temp) * decay;
  return [to + (change + temp) * decay, v];
}

function draw() {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(r.width * dpr) || canvas.height !== Math.round(r.height * dpr)) {
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const tick = renderTick();
  const f = frameAt(tick);
  if (f) {
    // Frame once the map's spawn points are in (or known to be missing).
    if (!state.framed && state.mapData) frameMap();
    if (state.framed && state.autoZoom && state.follow == null) followAction(f.players);
    lastPlayers = f.players;
    // Dead players are reported where they died (no position if before we connected).
    const target = state.follow != null && f.players.find(p => p.id === state.follow);
    if (target && target.pos) {
      state.view.cx += (target.pos[0] - state.view.cx) * 0.18;
      state.view.cy += (target.pos[1] - state.view.cy) * 0.18;
    }
    renderScoreboard(f.snap, tick);
  }
  drawBackground(r);
  if (f) {
    const byId = new Map(f.players.map(p => [p.id, p]));
    fireEvents(tick, byId);
    drawSpawnRooms(f.snap);
    drawObjectives(f.snap, tick);
    drawBuildings(f.snap);
    // Above the players in the overlay, where a dot would otherwise cover them.
    if (!OVERLAY) drawProjectiles(f.projectiles);
    drawEffects(byId);
    drawHealBeams(f.players, byId);
    drawPlayers(f.players);
    if (OVERLAY) drawProjectiles(f.projectiles);
    updatePanel(f.players, f.snap);
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
