# Cargo dependencies are not covered: Dependabot cannot resolve the private `../stvtf`
# path dependency. cargo-deny in CI reports advisories for them instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The page's dev tools (ESLint, Prettier, TypeScript): pinned exactly, bumped together.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]
