name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so new security advisories for the dependencies show up without a push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings are allowed locally but fail CI.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# Each job runs its checks through script/test, which runs them all locally.
# Cargo.toml depends on stvtf as `../stvtf`, so both repositories are checked out
# side by side: $GITHUB_WORKSPACE/stvtf-web and $GITHUB_WORKSPACE/stvtf. Neither checkout
# keeps its credentials: the build runs every dependency's build script, which could read them.
# Actions are pinned by commit; Dependabot bumps the SHA and the version comment together.
defaults:
  run:
    working-directory: stvtf-web

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stvtf-web
          persist-credentials: false
      - run: rustup toolchain install
      - run: script/test -v -t rustfmt

  eslint:
    name: eslint and page tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stvtf-web
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stvtf-web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: script/test -v -t eslint,prettier,tsc,page-tests

  # The linters mise.toml pins: shell scripts, workflows and the Dockerfile.
  lint:
    name: shellcheck, actionlint, zizmor and hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stvtf-web
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          working_directory: stvtf-web
      - run: script/test -v -t shellcheck,actionlint,zizmor,hadolint

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stvtf-web
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Arie/stvtf
          path: stvtf
          ssh-key: ${{ secrets.STVMAP_DEPLOY_KEY }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: stvtf-web
      - run: script/test -v -t clippy,rustdoc

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stvtf-web
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Arie/stvtf
          path: stvtf
          ssh-key: ${{ secrets.STVMAP_DEPLOY_KEY }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: stvtf-web
      # A BSP test fails without its map when CI is set. Bump the key when the list changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: stvtf-web/testdata/maps
          key: test-maps-v1
      - name: Download test maps
        run: |
          mkdir -p testdata/maps
          for map in cp_process_f12 cp_gullywash_f9 pl_upward_f12 pl_swiftwater_final1 mge_training_v8_beta4b cp_sunshine; do
            [ -f "testdata/maps/$map.bsp" ] || curl -fsSL -o "testdata/maps/$map.bsp" "https://fastdl.serveme.tf/maps/$map.bsp"
          done
      - run: script/test -v -t cargo-test

  browser:
    name: browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stvtf-web
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Arie/stvtf
          path: stvtf
          ssh-key: ${{ secrets.STVMAP_DEPLOY_KEY }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: stvtf-web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stvtf-web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright-core install --with-deps --only-shell chromium
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: stvtf-web/testdata/maps
          key: browser-maps-v1
      - name: Download the test's map
        run: |
          mkdir -p testdata/maps
          [ -f testdata/maps/cp_gullywash_f9.bsp ] || curl -fsSL -o testdata/maps/cp_gullywash_f9.bsp https://fastdl.serveme.tf/maps/cp_gullywash_f9.bsp
      - run: script/test -v -t browser

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stvtf-web
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Arie/stvtf
          path: stvtf
          ssh-key: ${{ secrets.STVMAP_DEPLOY_KEY }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny
      - run: script/test -v -t cargo-deny
