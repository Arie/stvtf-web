name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so new security advisories for the dependencies show up without a push.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings are allowed locally but fail CI.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# Cargo.toml depends on stvtf as `../stvtf`, so both repositories are checked out
# side by side: $GITHUB_WORKSPACE/stvtf-web and $GITHUB_WORKSPACE/stvtf. Neither checkout
# keeps its credentials: the build runs every dependency's build script, which could read them.
# Actions are pinned by commit; Dependabot bumps the SHA and the version comment together.
defaults:
  run:
    working-directory: stvtf-web

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stvtf-web
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stvtf-web
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Arie/stvtf
          path: stvtf
          ssh-key: ${{ secrets.STVMAP_DEPLOY_KEY }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: stvtf-web
      - run: cargo clippy --all-targets --locked
      - run: cargo doc --no-deps --locked

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stvtf-web
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Arie/stvtf
          path: stvtf
          ssh-key: ${{ secrets.STVMAP_DEPLOY_KEY }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: stvtf-web
      # The BSP tests skip themselves without this map; CI always runs them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: stvtf-web/cache/cp_process_f12.bsp
          key: bsp-cp_process_f12
      - name: Download test map
        run: |
          mkdir -p cache
          [ -f cache/cp_process_f12.bsp ] || curl -fsSL -o cache/cp_process_f12.bsp https://fastdl.serveme.tf/maps/cp_process_f12.bsp
      - run: cargo test --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stvtf-web
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Arie/stvtf
          path: stvtf
          ssh-key: ${{ secrets.STVMAP_DEPLOY_KEY }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny --locked check
