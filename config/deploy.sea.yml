servers:
  web:
    hosts: [direct.sea.serveme.tf]
    cmd: "--public --demo /data/demo.jsonl.gz --sessions /data/sessions --home https://sea.serveme.tf/stv"
    # Caps the damage of a runaway map build, so it cannot take serveme.tf down with it.
    options:
      memory: 1g

proxy:
  hosts:
    - sea.stv.tf
