servers:
  web:
    hosts: [direct.au.serveme.tf]
    # The AU web host is a 3.8 GB VPS that has frozen under memory pressure before.
    cmd: "--public --max-matches 5 --demo /data/demo.jsonl.gz --sessions /data/sessions --home https://au.serveme.tf/stv --relay-ports 28100-28103 --relay-host direct.au.serveme.tf"
    options:
      # Rooms as SourceTV relays for TF2 clients, on the host's own name: stv.tf names go through
      # Cloudflare, which carries no UDP.
      publish: ["28100-28103:28100-28103/udp"]
      memory: 256m

proxy:
  hosts:
    - au.stv.tf
