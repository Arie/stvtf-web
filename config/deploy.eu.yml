servers:
  web:
    hosts: [new.fakkelbrigade.eu]
    cmd: "--public --demo /data/demo.jsonl.gz --sessions /data/sessions --home https://serveme.tf/stv --relay-socket /data/relay.sock"
    options:
      # Caps the damage of a runaway map build, so it cannot take serveme.tf down with it.
      memory: 1g

proxy:
  hosts:
    - stv.tf

# The rooms' SourceTV relays, a process of their own that deploys leave be, so TF2 clients in a
# room stay connected (`bin/relays` restarts it, at the version just built). On the host's own
# name: stv.tf names go through Cloudflare, which carries no UDP.
accessories:
  relay:
    image: ghcr.io/arie/stvtf:<%= ENV["VERSION"] %>
    host: new.fakkelbrigade.eu
    cmd: "--relay-daemon /data/relay.sock --relay-ports 28100-28119 --relay-host new.fakkelbrigade.eu"
    volumes:
      - stvtf-cache:/data
    options:
      publish: ["28100-28119:28100-28119/udp"]
      memory: 1g
