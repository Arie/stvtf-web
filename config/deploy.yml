# stv.tf: this server as a Kamal app, one per region on the serveme.tf web hosts (sharing their
# kamal-proxy, which routes by domain). serveme.tf hands browsers encrypted start links;
# STVTF_TOKEN_KEY is the key both share. The image builds from the directory holding the
# stvtf and stvtf-web checkouts.
#   kamal deploy -d eu|na|au|sea
#
# The image holds both checkouts, but Kamal names a version after this repository's commit
# alone, so a change to stvtf only would reuse the tag and leave rollback guessing. The version
# names both commits instead, and like Kamal's own gets a random suffix while either has
# uncommitted changes. `--version` or VERSION still take precedence.
<%
  commit = ->(repo) do
    sha = `git -C #{repo} rev-parse --short=12 HEAD`.strip
    raise "no git checkout in #{repo}" unless $?.success?
    [sha, `git -C #{repo} status --porcelain`.empty?]
  end
  web, web_clean = commit.(".")
  lib, lib_clean = commit.("../stvtf")
  ENV["VERSION"] ||= "#{web}_stvtf_#{lib}#{"_uncommitted_#{SecureRandom.hex(8)}" unless web_clean && lib_clean}"
%>
service: stvtf
image: arie/stvtf
require_destination: true

registry:
  server: ghcr.io
  username: Arie
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: ..
  dockerfile: Dockerfile

env:
  secret:
    - STVTF_TOKEN_KEY

# The map cache (BSPs from fastdl, extracted geometry) survives deploys. The volume also holds
# demo.jsonl.gz, the recorded match each region plays at /w/demo/ (`stvtf demo FILE.dem | gzip`,
# copied in with `docker cp`).
volumes:
  - stvtf-cache:/data

ssh:
  user: kamal
  keys: ["~/.ssh/id_kamal"]

proxy:
  ssl: true
  app_port: 8080
  healthcheck:
    path: /up
    interval: 3
    timeout: 5
  # Each browser's event stream stays open for as long as it watches: pass it through as it
  # comes instead of buffering the response.
  buffering:
    responses: false

# Those streams never finish on their own, so a deploy would wait the full drain (30 s by default)
# for them before moving on. Browsers reconnect to the new container by themselves; the few
# seconds left are for ordinary requests in flight.
drain_timeout: 5

aliases:
  logs: app logs -f
