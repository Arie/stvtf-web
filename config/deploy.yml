# stv.tf: this server as a Kamal app, one per region on the serveme.tf web hosts (sharing their
# kamal-proxy, which routes by domain). serveme.tf hands browsers encrypted start links;
# STVMAP_TOKEN_KEY is the key both share. The image builds from the directory holding the
# stvmap and stvmap-web checkouts.
#   kamal deploy -d eu|na|au|sea
service: stvmap
image: arie/stvmap
require_destination: true

registry:
  server: ghcr.io
  username: Arie
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: ..
  dockerfile: Dockerfile

env:
  secret:
    - STVMAP_TOKEN_KEY

# The map cache (BSPs from fastdl, extracted geometry) survives deploys. The volume also holds
# demo.jsonl.gz, the recorded match each region plays at /w/demo/ (`stvmap demo FILE.dem | gzip`,
# copied in with `docker cp`).
volumes:
  - stvmap-cache:/data

ssh:
  user: kamal
  keys: ["~/.ssh/id_kamal"]

proxy:
  ssl: true
  app_port: 8080
  healthcheck:
    path: /up
    interval: 3
    timeout: 5
  # Each browser's event stream stays open for as long as it watches: pass it through as it
  # comes instead of buffering the response.
  buffering:
    responses: false

aliases:
  logs: app logs -f
