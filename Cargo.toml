[package]
name = "stvmap-web"
version = "0.1.0"
edition = "2024"
description = "Live top-down web viewer for a TF2 match, fed by stvmap"
license = "MIT"
# Not on crates.io (it depends on stvmap by path); also stops an accidental `cargo publish`.
publish = false

[dependencies]
stvmap = { path = "../stvmap" }
serde_json = "1"
anyhow = "1"
lzma-rs = "0.3"
ureq = "2"
aes-gcm = "0.10"
base64 = "0.22"

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
# Pedantic catches a lot of non-idiomatic Rust; a few of its lints do not fit this code.
pedantic = { level = "warn", priority = -1 }
# Binary parsing (BSP lumps) casts between integer widths all the time.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Leftover debugging and placeholders should not be committed.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
