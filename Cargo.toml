[package]
name = "stvtf-web"
version = "0.1.0"
edition = "2024"
description = "Live top-down web viewer for a TF2 match, fed by stvtf"
license = "Apache-2.0"
# Not on crates.io (it depends on stvtf by path); also stops an accidental `cargo publish`.
publish = false

[dependencies]
stvtf = { path = "../stvtf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
lzma-rs = "0.3"
ureq = "2"
aes-gcm = "0.10"
base64 = "0.22"
flate2 = "1"
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "panic", "ureq", "rustls"] }
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tower-http = { version = "0.7.1", features = ["set-header", "limit", "cors", "timeout", "csrf", "fs", "compression-gzip", "compression-br", "trace"] }
tokio-stream = "0.1.19"
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
cookie = "0.18"
serde_urlencoded = "0.7.1"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
rust-embed = { version = "8.14.0", features = ["include-exclude", "mime-guess"] }
tower = { version = "0.5.3", features = ["util"] }
mime_guess = "2.0.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
# Pedantic catches a lot of non-idiomatic Rust; a few of its lints do not fit this code.
pedantic = { level = "warn", priority = -1 }
# Binary parsing (BSP lumps) casts between integer widths all the time.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Leftover debugging and placeholders should not be committed.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dev-dependencies]

# The map tests are nearly all this crate's own code: this makes them about 7x faster, and debug
# assertions and overflow checks stay on.
[profile.dev]
opt-level = 1
